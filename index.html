<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d0a14" />
    <meta name="msapplication-TileColor" content="#0d0a14" />

    <meta name="google-site-verification" content="hg_nB8nhPW8ySf2XswYeBol3NknhZNiQEiQ9tza4HrA" />

    <!-- Primary Meta Tags -->
    <title>YuriOrbit — Your World of Girls' Love</title>
    <meta name="title" content="YuriOrbit — Your World of Girls' Love" />
    <meta name="description" content="Discover, track, and enjoy curated Yuri and Girls' Love anime, manga, manhwa, webtoons, light novels, and live-action dramas from around the globe." />
    <meta name="keywords" content="yuri, girls love, GL, yuri manga, yuri manhwa, yuri anime, GL webtoons, shoujo ai, GL dramas, GL novels, YuriOrbit, JoeKym Labs" />
    <meta name="author" content="JoeKym Labs" />
    <meta name="robots" content="index, follow" />

    <!--
      No static canonical or og:url here on purpose. This one shell answers every
      route, so a hard-coded value would declare /discover, /manga and friends to
      be duplicates of the homepage. `usePageMeta` writes the right one per route.
    -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YuriOrbit" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="YuriOrbit — Your World of Girls' Love" />
    <meta property="og:description" content="Discover, track, and enjoy curated Yuri and Girls' Love anime, manga, manhwa, webtoons, light novels, and live-action dramas from around the globe." />
    <meta property="og:image" content="https://yuriorbit.pages.dev/android-chrome-512x512.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YuriOrbit — Your World of Girls' Love" />
    <meta name="twitter:description" content="Discover, track, and enjoy curated Yuri and Girls' Love anime, manga, manhwa, webtoons, light novels, and live-action dramas from around the globe." />
    <meta name="twitter:image" content="https://yuriorbit.pages.dev/android-chrome-512x512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Structured Data (JSON-LD).
      `name` here is what Google uses for the site name; `og:site_name` covers the
      open-graph consumers. Both must agree, or the header falls back to the domain.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://yuriorbit.pages.dev/#website",
          "name": "YuriOrbit",
          "alternateName": ["Yuri Orbit", "YuriOrbit GL"],
          "description": "Your world of Girls' Love — anime, manga, manhwa, webtoons, novels, and dramas.",
          "url": "https://yuriorbit.pages.dev/",
          "inLanguage": "en",
          "publisher": { "@id": "https://yuriorbit.pages.dev/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://yuriorbit.pages.dev/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://yuriorbit.pages.dev/#organization",
          "name": "JoeKym Labs",
          "url": "https://joekymlabs.pages.dev",
          "logo": {
            "@type": "ImageObject",
            "url": "https://yuriorbit.pages.dev/android-chrome-512x512.png"
          }
        }
      ]
    }
    </script>
    <!--
      Static shell for crawlers and no-JS visitors. React replaces this on mount,
      so the real app UI (and its own headings) still takes over in the browser.
    -->
    <style>
      .boot-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 3rem 1.25rem;
        text-align: center;
        background: #0d0a14;
        color: #f6f4fb;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .boot-fallback h1 {
        margin: 0;
        max-width: 34rem;
        font-size: clamp(1.75rem, 5vw, 2.75rem);
        line-height: 1.15;
        font-weight: 600;
      }
      .boot-fallback p {
        margin: 0;
        max-width: 38rem;
        color: #b6b0c6;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .boot-fallback nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        justify-content: center;
        font-size: 0.875rem;
      }
      .boot-fallback a {
        color: #f7a8c8;
        text-decoration: none;
      }
      .boot-fallback a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body class="bg-ink-950 text-ink-50 selection:bg-rose-500/30 selection:text-rose-200">
    <div id="root">
      <div class="boot-fallback">
        <h1>YuriOrbit — Your World of Girls' Love</h1>
        <p>
          Discover, track, and enjoy curated Yuri and Girls' Love anime, manga, manhwa, webtoons, light novels, and
          live-action dramas from around the globe.
        </p>
        <nav aria-label="Browse the catalogue">
          <a href="/discover">Discover</a>
          <a href="/anime">GL Anime</a>
          <a href="/manga">GL Manga</a>
          <a href="/manhwa">GL Manhwa</a>
          <a href="/webtoons">GL Webtoons</a>
          <a href="/novels">GL Novels</a>
          <a href="/dramas">GL Dramas</a>
          <a href="/movies">GL Movies</a>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
